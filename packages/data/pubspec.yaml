name: milow_data
description: "Shared data models, DTOs, and repository interfaces for Milow applications."
version: 0.0.1
publish_to: "none"

environment:
  sdk: ^3.10.7
  flutter: ">=3.38.7"

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  fpdart: ^1.1.0
  freezed_annotation: ^3.1.0
  json_annotation: ^4.9.0
  milow_core:
    path: ../core
  supabase_flutter: ^2.12.0

dev_dependencies:
  build_runner: ^2.10.5
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  freezed: ^3.2.3
  json_serializable: ^6.9.0

flutter:
  uses-material-design: true
